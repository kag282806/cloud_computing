<VirtualHost *:80>
    DocumentRoot /var/www/so-thu-chi/public
    <Directory /var/www/so-thu-chi/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/so-thu-chi-error.log
    CustomLog ${APACHE_LOG_DIR}/so-thu-chi-access.log combined
</VirtualHost>
